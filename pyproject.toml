[project]
name = "agent-harness"
version = "0.1.0"
description = "Agent-agnostic harness tooling for local automation workflows."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "cyclopts>=3.24.0",
  "pydantic>=2.12.0",
]

[project.scripts]
pr-review-poller = "pr_review_poller.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pyright>=1.1.408",
  "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_review_poller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH", "RUF"]
ignore = [
  "COM812",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
