# prek.toml — repo-root cross-cutting hygiene hooks.
#
# Project-scoped hooks, when present, live in each project's own prek.toml.
# prek's workspace mode walks both. See README.md for setup commands.

# Built-in hooks (fast, offline, Rust-based)
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "mixed-line-ending" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
]

# Security and file checks
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "detect-private-key" },
  { id = "check-symlinks" },
  { id = "fix-byte-order-marker" },
  { id = "check-added-large-files" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "pretty-format-json", args = ["--autofix", "--indent=2"], exclude_types = ["jupyter"] },
]

# Secret-scanner (gitleaks)
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.21.4"
hooks = [
  { id = "gitleaks" },
]

# Typo checker — typos by crate-ci, very low false-positive rate.
[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.28.4"
hooks = [
  { id = "typos" },
]

# GitHub Actions workflow validation
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.7"
hooks = [
  { id = "actionlint" },
]

# Markdown / shell / yaml / toml formatting via prettier
[[repos]]
repo = "https://github.com/rbubley/mirrors-prettier"
rev = "v3.8.3"
hooks = [
  { id = "prettier", types_or = ["markdown", "shell", "toml", "yaml"] },
]

# Markdown linting
[[repos]]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "v0.22.1"
hooks = [
  { id = "markdownlint-cli2", name = "markdown lint" },
]

# Prose linting
[[repos]]
repo = "https://github.com/vale-cli/vale"
rev = "v3.14.1"
hooks = [
  { id = "vale" },
]

# Shell script linting
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [
  { id = "shellcheck" },
]

# Python formatting and linting (for utility scripts under skills/)
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.12"
hooks = [
  { id = "ruff-format", types_or = ["python", "pyi"] },
  { id = "ruff-check", types_or = ["python", "pyi"], args = ["--fix"] },
]

# Python type checking
[[repos]]
repo = "https://github.com/RobertCraigie/pyright-python"
rev = "v1.1.409"
hooks = [
  { id = "pyright" },
]
