[project]
name = "pr-review-poller"
version = "0.1.0"
description = "Poll GitHub pull requests for review activity and trigger agentic responses."
readme = "src/pr_review_poller/README.md"
requires-python = ">=3.14"
dependencies = [
  "cyclopts>=3.24.0",
  "pydantic>=2.12.0",
]

[project.scripts]
pr-review-poller = "pr_review_poller.cli:app"

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_review_poller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
